# ai-sdlc project configuration
adapter: mock              # primary adapter: mock | claude-code
fallback_adapters: []      # tried in order when the primary adapter fails
retry_budget: 2            # retry attempts per task after the first failure
parallel: false            # run independent tasks concurrently
commit_mode: auto          # per-task local git commits: auto | ask | off
diff_limit: 500            # max changed lines per task (policy guardrail)
approval_gates:            # stages requiring human approval at their exit gate
  - plan
  - deploy_ready
claude_command: claude     # binary used by the claude-code adapter
task_timeout_seconds: 600
test_commands: []          # shell commands run by ai-sdlc test, e.g.
                           #   - "cd backend && mvn test"
                           #   - "cd frontend && npm test"
# persona_permissions:     # optional override of file-edit rights per persona
#   validator: edit        #   "edit" grants file edits, "text" denies them
#   developer: text        #   defaults: analyst/planner/validator=text, rest=edit
